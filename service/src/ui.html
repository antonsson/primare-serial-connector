<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Primare I22</title>
<style>
  :root {
    --bg: #0b0b0d;
    --panel: #151518;
    --panel-2: #1d1d21;
    --line: #2a2a30;
    --text: #ececef;
    --muted: #8a8a93;
    --accent: #e8b04a;
    --accent-dim: #e8b04a33;
    --danger: #e5534b;
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    min-height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    background: radial-gradient(120% 60% at 50% 0%, #1a1712 0%, var(--bg) 60%) fixed;
  }
  main { max-width: 440px; margin: 0 auto; display: grid; gap: 14px; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 8px; }
  .brand { letter-spacing: .32em; font-weight: 600; font-size: 13px; text-transform: uppercase; }
  .brand small { display: block; letter-spacing: .12em; color: var(--muted); font-weight: 400; font-size: 11px; margin-top: 2px; }
  .conn { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: #4ec47a; box-shadow: 0 0 8px #4ec47a99; }
  .dot.err { background: var(--danger); }

  .power {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--panel-2); border: 1px solid var(--line);
    display: grid; place-items: center; color: var(--muted); transition: .2s;
  }
  .power svg { width: 22px; height: 22px; }
  .on .power { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 18px var(--accent-dim); }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .label { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }

  /* Volume */
  .dial { position: relative; width: min(78vw, 280px); aspect-ratio: 1; margin: 4px auto 10px; }
  .dial svg { width: 100%; height: 100%; transform: rotate(135deg); }
  .dial .track { stroke: var(--panel-2); }
  .dial .fill { stroke: var(--accent); transition: stroke-dashoffset .25s ease; filter: drop-shadow(0 0 6px var(--accent-dim)); }
  .muted .dial .fill { stroke: var(--muted); filter: none; }
  .readout { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .readout b { font-size: clamp(56px, 18vw, 76px); font-weight: 200; font-variant-numeric: tabular-nums; line-height: 1; }
  .readout span { color: var(--muted); font-size: 12px; letter-spacing: .2em; text-transform: uppercase; margin-top: 6px; }
  .muted .readout b { color: var(--muted); }

  .vol-row { display: grid; grid-template-columns: 56px 1fr 56px; gap: 12px; align-items: center; }
  .round { height: 56px; border-radius: 16px; background: var(--panel-2); border: 1px solid var(--line); font-size: 26px; font-weight: 300; }
  .round:active, .chip:active, .pill:active { transform: scale(.96); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, var(--accent) var(--p, 0%), var(--panel-2) var(--p, 0%)); }
  input[type=range]::-moz-range-track { height: 6px; border-radius: 3px; background: var(--panel-2); }
  input[type=range]::-moz-range-progress { height: 6px; border-radius: 3px; background: var(--accent); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%; background: var(--text); border: 0; box-shadow: 0 2px 8px #0008; }
  input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--text); border: 0; }

  .pill { width: 100%; margin-top: 14px; height: 48px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); letter-spacing: .14em; text-transform: uppercase; font-size: 12px; transition: .2s; }
  .muted .pill.mute { background: var(--danger); border-color: var(--danger); color: #fff; }

  /* Inputs */
  .inputs { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .chip { min-height: 52px; padding: 8px 12px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--line); text-align: left; transition: .2s; overflow: hidden; }
  .chip small { display: block; color: var(--muted); font-size: 10px; letter-spacing: .14em; }
  .chip span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip[aria-pressed=true] { border-color: var(--accent); background: linear-gradient(180deg, #2a2316, var(--panel-2)); color: var(--accent); }

  /* Balance + dim */
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .stepper { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 6px; }
  .stepper .round { height: 44px; font-size: 20px; border-radius: 12px; }
  .stepper output { text-align: center; font-size: 20px; font-weight: 300; font-variant-numeric: tabular-nums; }
  .bars { display: flex; gap: 6px; align-items: flex-end; height: 44px; }
  .bars button { flex: 1; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); transition: .2s; }
  .bars button.lit { background: var(--accent); border-color: var(--accent); }

  .off-note { text-align: center; color: var(--muted); font-size: 13px; padding: 6px 0 0; }
  .off .controls { opacity: .35; pointer-events: none; filter: grayscale(1); }
  .controls { display: grid; gap: 14px; transition: opacity .3s; }

  footer { text-align: center; color: var(--muted); font-size: 11px; padding-top: 4px; min-height: 1em; }
  .toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: #2b1615; color: #ffb4ae; border: 1px solid #5a2a27; padding: 10px 16px; border-radius: 12px; font-size: 13px; transition: transform .25s, opacity .25s; max-width: calc(100vw - 32px); }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main id="app" class="off">
  <header>
    <div class="brand">Primare<small>I22 Integrated</small></div>
    <div class="conn"><i class="dot" id="dot"></i><span id="connText">Connecting…</span></div>
    <button class="power" id="power" aria-label="Power" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v9"/><path d="M6.3 7.5a8 8 0 1 0 11.4 0"/></svg>
    </button>
  </header>

  <p class="off-note" id="offNote">Amplifier is in standby</p>

  <div class="controls">
    <section class="card" aria-label="Volume">
      <div class="dial">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="track" cx="50" cy="50" r="44" fill="none" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="75 100"/>
          <circle class="fill" id="arc" cx="50" cy="50" r="44" fill="none" stroke-width="5" stroke-linecap="round" pathLength="100" stroke-dasharray="75 100" stroke-dashoffset="75"/>
        </svg>
        <div class="readout"><b id="volNum">–</b><span id="volLabel">Volume</span></div>
      </div>
      <div class="vol-row">
        <button class="round" id="volDown" aria-label="Volume down">−</button>
        <input type="range" id="vol" min="0" max="79" value="0" aria-label="Volume">
        <button class="round" id="volUp" aria-label="Volume up">+</button>
      </div>
      <button class="pill mute" id="mute" aria-pressed="false">Mute</button>
    </section>

    <section class="card" aria-label="Input">
      <div class="label">Input</div>
      <div class="inputs" id="inputs"></div>
    </section>

    <div class="split">
      <section class="card" aria-label="Balance">
        <div class="label">Balance</div>
        <div class="stepper">
          <button class="round" id="balL" aria-label="Balance left">L</button>
          <output id="bal">0</output>
          <button class="round" id="balR" aria-label="Balance right">R</button>
        </div>
      </section>
      <section class="card" aria-label="Display brightness">
        <div class="label">Display</div>
        <div class="bars" id="dim"></div>
      </section>
    </div>
  </div>

  <footer id="info"></footer>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const app = $('app');
const s = { power: false, volume: 0, input: 0, mute: false, balance: 0, dim: 0 };
let names = {};
let busy = 0;          // in-flight user commands; skip polling while > 0
let dragging = false;

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error((await r.text()) || r.statusText);
  return r.json();
}

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

async function cmd(path, body) {
  busy++;
  try { Object.assign(s, await api(path, body)); render(); }
  catch (e) { toast(e.message); }
  finally { busy--; }
}

function render() {
  app.classList.toggle('off', !s.power);
  app.classList.toggle('on', s.power);
  app.classList.toggle('muted', s.mute);
  $('power').setAttribute('aria-pressed', s.power);
  $('offNote').hidden = s.power;

  if (!dragging) $('vol').value = s.volume;
  showVolume(+$('vol').value);

  $('mute').setAttribute('aria-pressed', s.mute);
  $('mute').textContent = s.mute ? 'Muted' : 'Mute';

  for (const b of $('inputs').children) b.setAttribute('aria-pressed', +b.dataset.id === s.input);

  $('bal').textContent = s.balance === 0 ? 'C' : (s.balance < 0 ? 'L' : 'R') + Math.abs(s.balance);

  [...$('dim').children].forEach((b, i) => b.classList.toggle('lit', i < s.dim));
}

function showVolume(v) {
  $('volNum').textContent = v;
  $('volLabel').textContent = s.mute ? 'Muted' : 'Volume';
  $('arc').style.strokeDashoffset = 75 - (v / 79) * 75;
  $('vol').style.setProperty('--p', (v / 79 * 100) + '%');
}

function buildInputs() {
  $('inputs').innerHTML = '';
  for (let i = 1; i <= 7; i++) {
    const b = document.createElement('button');
    b.className = 'chip';
    b.dataset.id = i;
    b.innerHTML = `<small>IN ${i}</small><span></span>`;
    b.querySelector('span').textContent = names[i] || `Input ${i}`;
    b.onclick = () => cmd('/input', { input: i });
    $('inputs').append(b);
  }
  render();
}

function buildDim() {
  for (let i = 1; i <= 3; i++) {
    const b = document.createElement('button');
    b.style.height = (12 + i * 10) + 'px';
    b.setAttribute('aria-label', `Brightness ${i}`);
    // Tapping the lit top bar turns the display off.
    b.onclick = () => cmd('/dim', { level: s.dim === i ? 0 : i });
    $('dim').append(b);
  }
}

async function loadNames() {
  for (let i = 1; i <= 7; i++) {
    try { names[i] = (await api(`/input/${i}/name`)).name.trim(); } catch { /* keep default */ }
  }
  buildInputs();
}

async function poll() {
  if (busy || dragging) return;
  try {
    const st = await api('/status');
    // /status hardcodes mute/balance/dim, so read those directly.
    const [m, b, d] = await Promise.all([api('/mute'), api('/balance'), api('/dim')]);
    if (busy || dragging) return;
    Object.assign(s, st, m, b, d);
    $('dot').className = 'dot ok';
    $('connText').textContent = 'Online';
    render();
  } catch {
    $('dot').className = 'dot err';
    $('connText').textContent = 'Offline';
  }
}

// ---- Wire up controls ----
$('power').onclick = async () => {
  const wasOff = !s.power;
  await cmd('/power', { state: 'toggle' });
  if (wasOff && s.power) { poll(); if (!Object.keys(names).length) loadNames(); }
};
$('volUp').onclick = () => cmd('/volume', { step: 1 });
$('volDown').onclick = () => cmd('/volume', { step: -1 });
$('mute').onclick = () => cmd('/mute', { state: !s.mute });
$('balL').onclick = () => s.balance > -9 && cmd('/balance', { value: s.balance - 1 });
$('balR').onclick = () => s.balance < 9 && cmd('/balance', { value: s.balance + 1 });

// Slider: preview locally while dragging, throttle sends, always send the final value.
const vol = $('vol');
let lastSent = 0, pending;
vol.addEventListener('input', () => {
  dragging = true;
  showVolume(+vol.value);
  clearTimeout(pending);
  const now = Date.now();
  if (now - lastSent > 250) { lastSent = now; cmd('/volume', { level: +vol.value }); }
  else pending = setTimeout(() => cmd('/volume', { level: +vol.value }), 250);
});
vol.addEventListener('change', () => {
  clearTimeout(pending);
  cmd('/volume', { level: +vol.value }).finally(() => { dragging = false; });
});

buildDim();
buildInputs();
api('/info').then(i => { $('info').textContent = `${i.model} · fw ${i.firmware}`; }).catch(() => {});
poll().then(() => s.power && loadNames());
setInterval(poll, 3000);
document.addEventListener('visibilitychange', () => !document.hidden && poll());
</script>
</body>
</html>
