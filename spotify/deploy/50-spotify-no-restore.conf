# WirePlumber: ~/.config/wireplumber/wireplumber.conf.d/50-spotify-no-restore.conf
# Don't restore (or save) volume on Soloist's stream. WirePlumber sets the volume
# on every new stream; Soloist reads that back as a Spotify slider change, which
# spotd would send to the amp.
stream.rules = [
  {
    matches = [ { application.name = "Spotify" } ]
    actions = { update-props = { state.restore-props = false } }
  }
]
